name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --node-linker=hoisted

      - name: Restore signing certificate
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\magune-lab-code-signing.pfx", $bytes)

      - name: Create signed APPX installer
        shell: pwsh
        env:
          CSC_LINK: ${{ runner.temp }}\magune-lab-code-signing.pfx
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: pnpm run package:msix

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "release-msix\myholypoly-windows-x64-*.appx" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw "APPX installer was not created." }
          $checksumFile = "release-msix\SHA256SUMS.txt"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $installer -Leaf)" | Set-Content $checksumFile -Encoding ascii
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $installer "distribution\magune-lab.cer" $checksumFile --clobber
          } else {
            gh release create $tag $installer "distribution\magune-lab.cer" $checksumFile `
              --title "myholypoly $tag" `
              --notes "Windows용 e-POLY 숙제 플래너 릴리즈입니다. 최신 기능 개선과 오류 수정을 포함합니다."
          }
